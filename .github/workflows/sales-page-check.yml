name: Contractor Sales Page Contract
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate buyer intake and no direct uploads
        run: python -m unittest discover -s tests -p 'test_*_page.py'
      - name: Syntax-check inline customer email composer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from re import search
          page = Path("dfw-trades.html").read_text()
          match = search(r"<script>(.*?)</script>", page, flags=16)
          assert match, "Missing inline email composer"
          Path("/tmp/dfw-intake.js").write_text(match.group(1))
          PY
          node --check /tmp/dfw-intake.js
      - name: Validate local CSV analyzer
        run: node --test tests/callback-preview.test.mjs
      - name: Syntax-check browser-only preview
        shell: bash
        run: |
          set -euo pipefail
          node --check callback-preview-core.mjs
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("callback-preview.html").read_text()
          match = re.search(r'<script type="module">(.*?)</script>', html, re.S)
          assert match, "Browser analyzer module not found"
          Path("/tmp/garcar-preview-inline.mjs").write_text(match.group(1))
          PY
          node --check /tmp/garcar-preview-inline.mjs
